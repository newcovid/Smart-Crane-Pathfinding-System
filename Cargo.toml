[package]
name = "smart_crane_core"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "High-performance pathfinding core for Smart Crane (A*, D* Lite, Bezier smoothing)"

# 生成动态链接库供 Python 调用
[lib]
name = "smart_crane_core"
crate-type = ["cdylib"]

[dependencies]
# PyO3 用于 Python 绑定
pyo3 = { version = "0.29", features = ["extension-module"] }


# 用于处理浮点数哈希（A* 需要 Eq/Hash trait）
ordered-float = "4.6.0"

# 日志支持
log = "0.4.28"
pyo3-log = "0.13"