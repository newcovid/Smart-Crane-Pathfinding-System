<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能起重机控制台 Pro V10.6 (Ceiling Fix)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { primary: '#3b82f6', darkbg: '#0f172a', lightbg: '#f8fafc', success: '#10b981', danger: '#f43f5e' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    animation: { 'fadeIn': 'fadeIn 0.2s ease-out forwards' },
                    keyframes: { fadeIn: { '0%': { opacity: '0', transform: 'translateY(-5px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
                } 
            } 
        }
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="bg-lightbg dark:bg-darkbg text-slate-800 dark:text-slate-200 font-sans transition-colors duration-300 antialiased overflow-hidden">
    
    {% raw %}
    <div id="app" class="w-full h-full flex flex-col" v-cloak>
        <!-- Top Bar -->
        <header class="h-12 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 shrink-0 z-20 relative">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-primary/10 rounded-lg flex items-center justify-center text-primary">
                    <i class="ph-bold ph-crane text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide">智能起重机 <span class="text-primary">Pro</span></h1>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-[10px] text-slate-500 font-mono">
                   <span class="flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full" :class="connection.connected ? 'bg-success' : 'bg-danger'"></span>
                        {{ connection.statusText }}
                    </span>
                    <span>|</span>
                    <span>{{ connection.latency }}ms</span>
                </div>

                <div class="bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg flex gap-1">
                    <button @click="ui.viewMode = '2d'" :class="{'bg-white dark:bg-slate-700 shadow-sm text-primary': ui.viewMode === '2d', 'text-slate-400': ui.viewMode !== '2d'}" class="px-3 py-1 rounded text-xs font-bold transition-all">二维</button>
                    <button @click="ui.viewMode = '3d'" :class="{'bg-white dark:bg-slate-700 shadow-sm text-primary': ui.viewMode === '3d', 'text-slate-400': ui.viewMode !== '3d'}" class="px-3 py-1 rounded text-xs font-bold transition-all">三维</button>
                </div>
                
                <button @click="toggleTheme" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500 transition-colors">
                    <i :class="isDark ? 'ph-bold ph-sun' : 'ph-bold ph-moon'"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex-1 flex overflow-hidden relative">
            
            <!-- Sidebar (Settings) -->
            <aside class="w-80 bg-white/80 dark:bg-slate-900/90 backdrop-blur-xl border-r border-slate-200 dark:border-slate-800 flex flex-col transition-all duration-300 z-10">
                <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                    
                    <!-- 1. Map Config -->
                    <section>
                        <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-wider">地图环境</h3>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <number-input label="长度 (m)" v-model="settings.MAP_LENGTH_M" unit="m"></number-input>
                            <number-input label="宽度 (m)" v-model="settings.MAP_WIDTH_M" unit="m"></number-input>
                            <number-input label="高度 (m)" v-model="settings.MAP_HEIGHT_M" unit="m"></number-input>
                            <number-input label="分辨率 (m)" v-model="settings.MAP_RESOLUTION_M" unit="m" step="0.1"></number-input>
                        </div>
                        <button @click="applySettings" class="w-full py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold rounded transition-colors border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200">
                            重置地图尺寸
                        </button>
                    </section>

                    <!-- 2. Crane Physics -->
                    <section>
                        <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-wider">起重机物理参数</h3>
                        <div class="space-y-3">
                            <div class="space-y-1">
                                <label class="text-[10px] text-slate-500 font-medium ml-1">形状</label>
                                <select v-model="settings.CRANE_FOOTPRINT_SHAPE" class="w-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-xs text-slate-700 dark:text-slate-200 focus:ring-1 focus:ring-primary focus:outline-none">
                                    <option value="box">矩形 (Box)</option>
                                    <option value="circle">圆形 (Circle)</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <number-input label="宽度/直径 (m)" v-model="settings.CRANE_FOOTPRINT_WIDTH" unit="m"></number-input>
                                <number-input label="长度 (m)" v-model="settings.CRANE_FOOTPRINT_LENGTH" unit="m" v-if="settings.CRANE_FOOTPRINT_SHAPE === 'box'"></number-input>
                                <number-input label="高度 (m)" v-model="settings.CRANE_FOOTPRINT_HEIGHT" unit="m"></number-input>
                            </div>
                        </div>
                    </section>

                    <!-- 3. Safety Strategy -->
                    <section>
                        <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-wider">安全策略</h3>
                        <div class="space-y-3">
                            <!-- 垂直安全余量 (全局) -->
                            <number-input label="垂直安全余量 (m)" v-model="settings.CRANE_Z_SAFETY_MARGIN" unit="m" step="0.1" title="起重机底部距离障碍物顶部的最小安全距离"></number-input>
                            
                            <!-- 障碍物模式 (全局) -->
                            <toggle-switch label="无限高障碍模式" v-model="settings.OBSTACLE_INFINITE_HEIGHT"></toggle-switch>

                            <!-- 2.5D 巡航 -->
                            <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
                                <toggle-switch label="启用定高巡航 (2.5D)" v-model="settings.ENABLE_FIXED_HEIGHT_CRUISE"></toggle-switch>
                                <div v-if="settings.ENABLE_FIXED_HEIGHT_CRUISE" class="pl-2 border-l-2 border-slate-200 dark:border-slate-700 mt-2">
                                    <number-input label="巡航高度 (m)" v-model="settings.CRANE_SAFE_TRAVEL_Z_M" unit="m"></number-input>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 4. Algorithm Tuning -->
                    <section>
                        <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-wider">算法微调</h3>
                        <div class="space-y-3">
                             <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded">
                                <button class="flex-1 py-1 text-[10px] font-bold rounded" :class="settings.PLANNER_ALGORITHM==='astar'?'bg-white dark:bg-slate-600 shadow text-primary':'text-slate-500'" @click="settings.PLANNER_ALGORITHM='astar'">A* 全量</button>
                                <button class="flex-1 py-1 text-[10px] font-bold rounded" :class="settings.PLANNER_ALGORITHM==='dslite'?'bg-white dark:bg-slate-600 shadow text-primary':'text-slate-500'" @click="settings.PLANNER_ALGORITHM='dslite'">D* 增量</button>
                            </div>
                            <toggle-switch label="3D Octile 距离 (更贴合网格)" v-model="settings.USE_3D_OCTILE"></toggle-switch>
                            <div class="flex items-center justify-between px-1">
                                <span class="text-[10px] text-slate-500">启发式权重</span>
                                <input type="number" v-model="settings.HEURISTIC_WEIGHT" step="0.1" class="w-12 text-right bg-transparent text-xs font-mono border-b border-slate-300 dark:border-slate-600 focus:outline-none">
                            </div>
                            
                            <div class="h-px bg-slate-100 dark:bg-slate-800 my-2"></div>
                            
                            <toggle-switch label="L1.5 捷径优化 (Greedy)" v-model="settings.ENABLE_SHORTCUT_OPTIMIZATION"></toggle-switch>
                            
                            <div class="space-y-2">
                                <toggle-switch label="L1.5 贝塞尔平滑" v-model="settings.ENABLE_BEZIER_SMOOTHING"></toggle-switch>
                                <div v-if="settings.ENABLE_BEZIER_SMOOTHING" class="grid grid-cols-2 gap-2 pl-2 border-l-2 border-slate-200 dark:border-slate-700">
                                    <number-input label="平滑度 (0-0.5)" v-model="settings.BEZIER_SMOOTHNESS" step="0.05"></number-input>
                                    <number-input label="细分段数" v-model="settings.BEZIER_SEGMENTS" step="1"></number-input>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Tools -->
                    <section>
                        <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-wider">工具箱</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <tool-btn icon="ph-hand-grabbing" label="浏览" value="view" v-model="interaction.mode"></tool-btn>
                            <tool-btn icon="ph-flag-checkered" label="设起点" value="set_start" color="text-success" v-model="interaction.mode"></tool-btn>
                            <tool-btn icon="ph-flag" label="设终点" value="set_end" color="text-danger" v-model="interaction.mode"></tool-btn>
                            <tool-btn icon="ph-cube" label="静态物" value="add_static" v-model="interaction.mode"></tool-btn>
                            <tool-btn icon="ph-truck" label="动态物" value="add_dynamic" color="text-orange-500" v-model="interaction.mode"></tool-btn>
                            <tool-btn icon="ph-eraser" label="移除" value="remove" color="text-red-500" v-model="interaction.mode"></tool-btn>
                        </div>
                        <div v-if="interaction.mode.startsWith('add_')" class="mt-2 p-2 bg-blue-50 dark:bg-blue-900/20 rounded border border-blue-100 dark:border-blue-800">
                            <number-input label="物体高度 (m)" v-model="interaction.addHeight" unit="m"></number-input>
                        </div>
                    </section>
                    
                    <div class="pt-2 pb-6">
                        <button @click="requestPlan" class="w-full py-3 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
                            <i class="ph-bold ph-play"></i>
                            执行路径规划
                        </button>
                        <button @click="applySettings" class="w-full mt-2 py-2 text-xs text-slate-400 hover:text-primary transition-colors">
                            仅应用配置 (Ctrl+S)
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Canvas Container -->
            <main class="flex-1 relative bg-slate-100 dark:bg-[#0f172a] overflow-hidden flex flex-col">
                
                <!-- Canvas Area -->
                <div class="flex-1 relative overflow-hidden">
                    <canvas-2d v-if="ui.viewMode === '2d'" :map="mapState" :interaction="interaction" :path="pathData" :mission="missionState" :settings="settings" :visuals="visuals" :is-dark="isDark" :active="ui.viewMode === '2d'" @map-click="handleMapClick" @map-drag="handleMapDrag"></canvas-2d>
                    <canvas-3d v-if="ui.viewMode === '3d'" :map="mapState" :path="pathData" :mission="missionState" :active="ui.viewMode === '3d'"></canvas-3d>
                    
                    <!-- HUD -->
                    <div v-if="lastStats" class="absolute top-4 right-4 pointer-events-none">
                        <div class="glass-panel p-3 rounded-lg shadow-lg border border-slate-200 dark:border-slate-700 w-48">
                            <div class="flex justify-between text-xs font-bold mb-1">
                                <span class="text-slate-500">耗时</span>
                                <span class="text-primary">{{ lastStats.pipeline_total_ms.toFixed(1) }} ms</span>
                            </div>
                             <div class="flex justify-between text-xs font-bold">
                                <span class="text-slate-500">搜索节点</span>
                                <span class="text-slate-300">{{ lastStats.l1_planner.nodes_expanded }}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Log Panel (Bottom) -->
                <div class="h-48 shrink-0 relative z-10" v-show="ui.showLogs">
                    <log-panel :logs="logs" @clear="logs = []" @close="ui.showLogs = false"></log-panel>
                </div>
                <button v-if="!ui.showLogs" @click="ui.showLogs = true" class="absolute bottom-0 left-0 right-0 h-6 bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-[10px] text-slate-400 border-t border-slate-700 transition-colors z-20">
                    <i class="ph-bold ph-caret-up mr-1"></i> 显示日志
                </button>

            </main>
        </div>
    </div>
    {% endraw %}

    <!-- 主程序逻辑 (ES Module) -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
